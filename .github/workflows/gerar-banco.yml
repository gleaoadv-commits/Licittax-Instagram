name: Gerar banco de dicas

on:
  workflow_dispatch:
    inputs:
      trilhas:
        description: "Trilhas a gerar, separadas por virgula (ex.: 1,3)"
        type: string
        default: "1,2,3,4,5,6"
      candidatas:
        description: "Candidatas geradas por trilha"
        type: string
        default: "20"
      max_aprovadas:
        description: "Parar ao atingir este total de aprovadas na trilha"
        type: string
        default: "15"
      min_aprovadas:
        description: "Minimo de aprovadas novas; abaixo disso a trilha conta como falha"
        type: string
        default: "8"

permissions:
  contents: write

concurrency:
  group: licittax-publicacao
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Configurar git
        run: |
          git config user.name "licittax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Gerar dicas e commitar o banco (mesmo se parcial)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRILHAS: ${{ inputs.trilhas }}
          CANDIDATAS: ${{ inputs.candidatas }}
          MAX_APROVADAS: ${{ inputs.max_aprovadas }}
          MIN_APROVADAS: ${{ inputs.min_aprovadas }}
        run: |
          set +e
          timeout 330m python -m licittax.dicas.gerar_banco \
            --trilhas "$TRILHAS" --candidatas "$CANDIDATAS" \
            --max-aprovadas "$MAX_APROVADAS" --min-aprovadas "$MIN_APROVADAS"
          rc=$?
          set -e
          git add data/banco_dicas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no banco."
          else
            git commit -m "chore: atualizar banco de dicas"
            git pull --rebase
            git push
          fi
          exit $rc
